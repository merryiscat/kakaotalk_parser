# ============================================================
# 톡비서 서버 — Docker Compose 설정
#
# 사용법:
#   docker compose up -d        # 백그라운드 실행
#   docker compose logs -f      # 로그 확인
#   docker compose down         # 중지
#   docker compose up -d --build  # 코드 변경 후 재빌드 & 실행
# ============================================================

services:
  tokbiseo-server:
    # 현재 디렉토리의 Dockerfile로 이미지 빌드
    build: .
    container_name: tokbiseo-server

    # .env 파일에서 환경변수 로드 (API 키 등)
    env_file:
      - .env

    # 포트 매핑: 호스트 3936 → 컨테이너 3936
    ports:
      - "3936:3936"

    # 로그 파일을 호스트에 영속 저장
    # data: 티스토리 로그인 세션(storage_state) 영속화
    #   — 컨테이너를 재빌드해도 재로그인(캡차) 없이 발행 가능
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    # Chromium 공유 메모리 확보 (티스토리 발행용 Playwright)
    # Docker 기본값 64MB로는 렌더링 중 Chromium이 조용히 크래시합니다.
    shm_size: 1gb

    # 서버 크래시나 PC 재부팅 시 자동 재시작
    restart: unless-stopped

    # /health 엔드포인트로 서버 상태 주기적 확인
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3936/health')"]
      interval: 30s      # 30초마다 확인
      timeout: 10s        # 10초 내 응답 없으면 실패
      retries: 3          # 3회 연속 실패 시 unhealthy
      start_period: 15s   # 시작 후 15초 대기 (초기화 시간)
