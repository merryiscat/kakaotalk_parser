[project]
name = "tokbiseo-server"
version = "0.1.0"
description = "톡비서 멀티에이전트 서버 — FastAPI + LangGraph 기반 카카오톡 대화 AI 분석"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "tavily-python>=0.5.0",
    "google-api-python-client>=2.160.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    # 티스토리 발행용 브라우저 자동화
    # (티스토리 Open API가 2024년 2월 종료되어 에디터 자동화가 유일한 경로)
    "playwright>=1.47.0",
]
